[project]
name = "fde-auto-fnol-training"
version = "1.1.0"
description = "Fictional Associate FDE capstone simulator and fixtures"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
aws = [
    "boto3>=1.35.0",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src", "server"]
branch = false
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
]
