AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ECS task definitions for the seven FNOL Fargate services and a one-off
  migrate task. This stack does not create the cluster, the VPC, the task
  roles, the log groups, or the Cloud Map namespace. ManageServices defaults
  to false, so a deploy only registers task definition revisions and does not
  replace the running services. Roll those revisions with update-service after
  the migrate task succeeds. Image tag 1.1.2 does not contain the Postgres
  driver; publish a new tag before StateBackend=postgres is rolled out.
  Step servers listen on 8080. Cloud Map names distinguish them.

Parameters:
  ClusterName:
    Type: String
    Default: fnol
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9-]{0,30}"
  ImageTag:
    Type: String
    Default: "1.1.2"
    AllowedPattern: "[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}"
    Description: ECR tag. The running tag 1.1.2 has no psycopg. Build a new tag before cutover.
  StateBackend:
    Type: String
    Default: postgres
    AllowedValues:
      - postgres
      - sqlite
    Description: postgres sets FNOL_RDS_* and uses the postgres dependency group. sqlite matches the EFS tasks.
  PgNamespace:
    Type: String
    Default: shared
    AllowedPattern: "shared"
  DatabaseName:
    Type: String
    Default: fnol
    AllowedPattern: "[a-z][a-z0-9_]{0,30}"
  DatabaseEndpoint:
    Type: String
    Default: ""
    AllowedPattern: "^$|[A-Za-z0-9._-]+"
    Description: DatabaseEndpoint output from the fnol-data stack. Required when StateBackend is postgres.
  MountEfs:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Keep the fnol-state EFS mount through cutover. Set false only after Postgres is accepted.
  EfsFileSystemId:
    Type: String
    Default: fs-035b11da15aa05ed6
    AllowedPattern: "fs-[0-9a-f]+"
  AppSubnetA:
    Type: String
    Default: subnet-00eea3b5317c5e492
    AllowedPattern: "subnet-[0-9a-f]+"
    Description: fnol-private-a (us-east-1a, 10.43.11.0/24).
  AppSubnetB:
    Type: String
    Default: subnet-02cadb526cc74c182
    AllowedPattern: "subnet-[0-9a-f]+"
    Description: fnol-private-b (us-east-1b, 10.43.12.0/24).
  TaskSecurityGroupId:
    Type: String
    Default: sg-0902a6085d45388f5
    AllowedPattern: "sg-[0-9a-f]+"
    Description: Existing fnol-tasks security group.
  DnsNamespace:
    Type: String
    Default: fnol.internal
    Description: Existing Cloud Map private DNS namespace.
  ManageServices:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      False registers task definitions only. True also creates ECS services.
      Leave false while the live services exist, then adopt them with
      update-service or a CloudFormation import. See deploy/aws/README.md.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
    Description: Used only when ManageServices is true. Confirm the live count before import.
  IntakeDiscoveryServiceId:
    Type: String
    Default: ""
    AllowedPattern: "^$|srv-[A-Za-z0-9]+"
    Description: Existing Cloud Map service id for intake.fnol.internal. Optional. Used only when ManageServices is true.

  PolicyDiscoveryServiceId:
    Type: String
    Default: ""
    AllowedPattern: "^$|srv-[A-Za-z0-9]+"
    Description: Existing Cloud Map service id for policy.fnol.internal. Optional. Used only when ManageServices is true.

  RulesDiscoveryServiceId:
    Type: String
    Default: ""
    AllowedPattern: "^$|srv-[A-Za-z0-9]+"
    Description: Existing Cloud Map service id for rules.fnol.internal. Optional. Used only when ManageServices is true.

  CitationsDiscoveryServiceId:
    Type: String
    Default: ""
    AllowedPattern: "^$|srv-[A-Za-z0-9]+"
    Description: Existing Cloud Map service id for citations.fnol.internal. Optional. Used only when ManageServices is true.

  EnterpriseDiscoveryServiceId:
    Type: String
    Default: ""
    AllowedPattern: "^$|srv-[A-Za-z0-9]+"
    Description: Existing Cloud Map service id for enterprise.fnol.internal. Optional. Used only when ManageServices is true.

  ReviewerDiscoveryServiceId:
    Type: String
    Default: ""
    AllowedPattern: "^$|srv-[A-Za-z0-9]+"
    Description: Existing Cloud Map service id for reviewer.fnol.internal. Optional. Used only when ManageServices is true.

Rules:
  PostgresNeedsEndpoint:
    RuleCondition: !Equals [!Ref StateBackend, postgres]
    Assertions:
      - Assert: !Not [!Equals [!Ref DatabaseEndpoint, ""]]
        AssertDescription: DatabaseEndpoint is required when StateBackend is postgres.

Conditions:
  UsePostgres: !Equals [!Ref StateBackend, postgres]
  MountStateVolume: !Equals [!Ref MountEfs, "true"]
  CreateServices: !Equals [!Ref ManageServices, "true"]
  HasIntakeDiscovery: !Not [!Equals [!Ref IntakeDiscoveryServiceId, ""]]
  HasPolicyDiscovery: !Not [!Equals [!Ref PolicyDiscoveryServiceId, ""]]
  HasRulesDiscovery: !Not [!Equals [!Ref RulesDiscoveryServiceId, ""]]
  HasCitationsDiscovery: !Not [!Equals [!Ref CitationsDiscoveryServiceId, ""]]
  HasEnterpriseDiscovery: !Not [!Equals [!Ref EnterpriseDiscoveryServiceId, ""]]
  HasReviewerDiscovery: !Not [!Equals [!Ref ReviewerDiscoveryServiceId, ""]]

Resources:
  IntakeTask:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Family: fnol-intake
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/fnol/fnol-execution
      TaskRoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/fnol/fnol-intake
      Volumes:
        - !If
          - MountStateVolume
          - Name: state
            EFSVolumeConfiguration:
              FilesystemId: !Ref EfsFileSystemId
              TransitEncryption: ENABLED
              RootDirectory: /
          - !Ref AWS::NoValue
      ContainerDefinitions:
        - Name: intake
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/fnol:${ImageTag}
          Essential: true
          Command: !If
            - UsePostgres
            - - uv
              - run
              - --locked
              - --group
              - aws
              - --group
              - postgres
              - --no-dev
              - python
              - server/input_server.py
              - --http
            - - uv
              - run
              - --locked
              - --group
              - aws
              - --no-dev
              - python
              - server/input_server.py
              - --http
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
          - Name: FNOL_AWS_REGION
            Value: !Ref AWS::Region
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: FNOL_HTTP_PORT
            Value: "8080"
          - Name: FNOL_S3_BUCKET
            Value: !Sub fnol-${AWS::AccountId}-evidence
          - Name: FNOL_STATE_DIR
            Value: !If [MountStateVolume, "/mnt/state", "/tmp/fnol-state"]
          - Name: FNOL_MOCK_URL
            Value: !Sub http://enterprise.${DnsNamespace}:8767
          - !If
            - UsePostgres
            - Name: FNOL_RDS_IAM_AUTH
              Value: "1"
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_HOST
              Value: !Ref DatabaseEndpoint
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_PORT
              Value: "5432"
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_DB
              Value: !Ref DatabaseName
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_USER
              Value: fnol_intake
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_PG_NAMESPACE
              Value: !Ref PgNamespace
            - !Ref AWS::NoValue
          MountPoints:
            - !If
              - MountStateVolume
              - SourceVolume: state
                ContainerPath: /mnt/state
                ReadOnly: false
              - !Ref AWS::NoValue
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /fnol/intake
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

