            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /fnol/analyst
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  EnterpriseTask:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Family: fnol-enterprise
