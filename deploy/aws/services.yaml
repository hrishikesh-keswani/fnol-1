    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Family: fnol-analyst
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/fnol/fnol-execution
      TaskRoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/fnol/fnol-analyst
      Volumes:
        - !If
          - MountStateVolume
          - Name: state
            EFSVolumeConfiguration:
              FilesystemId: !Ref EfsFileSystemId
              TransitEncryption: ENABLED
              RootDirectory: /
          - !Ref AWS::NoValue
      ContainerDefinitions:
        - Name: analyst
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/fnol:${ImageTag}
          Essential: true
          Command: !If
            - UsePostgres
            - - /bin/sh
              - -c
              - uv run --locked --group aws --group postgres --no-dev python -c "import psycopg; from fnol_foundation.db import ensure_ready; ensure_ready()" && exec uv run --locked --group aws --group postgres --no-dev python -m fnol_analyst.follow
            - - sleep
              - infinity
          Environment:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: FNOL_AWS_REGION
            Value: !Ref AWS::Region
          - Name: FNOL_AI_ENABLED
            Value: "1"
          - Name: FNOL_MODEL_PROVIDER
            Value: bedrock
          - Name: FNOL_BEDROCK_AUTH
            Value: iam
          - Name: BEDROCK_GUARDRAIL_ID
            Value: !ImportValue fnol-shadow-guardrail-id
          - Name: BEDROCK_GUARDRAIL_VERSION
            Value: !ImportValue fnol-shadow-guardrail-version
