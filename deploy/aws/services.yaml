            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_PG_NAMESPACE
              Value: !Ref PgNamespace
            - !Ref AWS::NoValue
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          MountPoints:
            - !If
              - MountStateVolume
              - SourceVolume: state
                ContainerPath: /mnt/state
                ReadOnly: false
              - !Ref AWS::NoValue
          HealthCheck:
            Command:
              - CMD-SHELL
