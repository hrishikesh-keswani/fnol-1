    Condition: CreateServices
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ServiceName: intake
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref IntakeTask
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: "1.4.0"
      EnableExecuteCommand: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref TaskSecurityGroupId
          Subnets:
            - !Ref AppSubnetA
            - !Ref AppSubnetB
      ServiceRegistries: !If
        - HasIntakeDiscovery
        - - RegistryArn: !Sub arn:aws:servicediscovery:${AWS::Region}:${AWS::AccountId}:service/${IntakeDiscoveryServiceId}
            ContainerName: intake
