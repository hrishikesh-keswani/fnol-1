            - UsePostgres
            - - uv
              - run
              - --locked
              - --group
              - aws
              - --group
              - postgres
              - --no-dev
              - python
              - tools/runtime.py
              - serve
              - --host
              - 0.0.0.0
              - --port
              - "8767"
              - --state
              - !If [MountStateVolume, "/mnt/state/mock.sqlite", "/tmp/fnol-state/mock.sqlite"]
            - - uv
              - run
              - --locked
              - --group
              - aws
              - --no-dev
              - python
              - tools/runtime.py
              - serve
              - --host
              - 0.0.0.0
              - --port
              - "8767"
              - --state
              - !If [MountStateVolume, "/mnt/state/mock.sqlite", "/tmp/fnol-state/mock.sqlite"]
          PortMappings:
            - ContainerPort: 8767
              Protocol: tcp
          Environment:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: FNOL_STATE_DIR
            Value: !If [MountStateVolume, "/mnt/state", "/tmp/fnol-state"]
          - Name: FNOL_MOCK_STATE
            Value: !If [MountStateVolume, "/mnt/state/mock.sqlite", "/tmp/fnol-state/mock.sqlite"]
          - !If
            - UsePostgres
            - Name: FNOL_RDS_IAM_AUTH
              Value: "1"
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_HOST
              Value: !Ref DatabaseEndpoint
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_PORT
              Value: "5432"
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_DB
              Value: !Ref DatabaseName
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_USER
              Value: fnol_enterprise
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_PG_NAMESPACE
              Value: !Ref PgNamespace
            - !Ref AWS::NoValue
          MountPoints:
            - !If
              - MountStateVolume
              - SourceVolume: state
                ContainerPath: /mnt/state
                ReadOnly: false
              - !Ref AWS::NoValue
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/health', timeout=3)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /fnol/enterprise
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  ReviewerTask:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Family: fnol-reviewer
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/fnol/fnol-execution
      TaskRoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/fnol/fnol-reviewer
      Volumes:
        - !If
          - MountStateVolume
          - Name: state
            EFSVolumeConfiguration:
              FilesystemId: !Ref EfsFileSystemId
              TransitEncryption: ENABLED
              RootDirectory: /
          - !Ref AWS::NoValue
      ContainerDefinitions:
        - Name: reviewer
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/fnol:${ImageTag}
          Essential: true
          Command: !If
            - UsePostgres
            - - uv
              - run
              - --locked
              - --group
              - aws
              - --group
              - postgres
              - --no-dev
              - python
              - server/reviewer.py
              - --host
              - 0.0.0.0
              - --port
              - "8090"
            - - uv
              - run
              - --locked
              - --group
              - aws
              - --no-dev
              - python
              - server/reviewer.py
              - --host
              - 0.0.0.0
              - --port
              - "8090"
          PortMappings:
            - ContainerPort: 8090
              Protocol: tcp
          Environment:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: FNOL_ANALYST_URL
            Value: !Sub http://analyst.${DnsNamespace}:8080
          - Name: FNOL_MOCK_STATE
            Value: !If [MountStateVolume, "/mnt/state/mock.sqlite", "/tmp/fnol-state/mock.sqlite"]
          - !If
            - UsePostgres
            - Name: FNOL_RDS_IAM_AUTH
              Value: "1"
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_HOST
              Value: !Ref DatabaseEndpoint
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_PORT
              Value: "5432"
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_DB
              Value: !Ref DatabaseName
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_RDS_USER
              Value: fnol_reviewer
            - !Ref AWS::NoValue
          - !If
            - UsePostgres
            - Name: FNOL_PG_NAMESPACE
              Value: !Ref PgNamespace
            - !Ref AWS::NoValue
          MountPoints:
            - !If
              - MountStateVolume
              - SourceVolume: state
                ContainerPath: /mnt/state
                ReadOnly: false
              - !Ref AWS::NoValue
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /fnol/reviewer
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

